name: "Update"

# every sunday, after nixbuilds' saturday update: newer inputs, checked,
# then a pr to merge. nothing reaches main without the merge
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://charon.cachix.org
            extra-trusted-public-keys = charon.cachix.org-1:epdetEs1ll8oi8DT8OG2jEA4whj3FDbqgPFvapEPbY8=

      - name: Update inputs
        run: nix flake update 2>&1 | tee "$RUNNER_TEMP/log"

      # every host evaluates and the checks build, the same as `just check`
      - name: Check
        run: nix flake check --keep-going

      - name: Describe
        run: |
          {
            echo '```'
            grep -E "Updated input|^ .*' \([0-9-]+\)$" "$RUNNER_TEMP/log" || true
            echo '```'
          } >"$RUNNER_TEMP/body.md"

      - name: Open pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update
          delete-branch: true
          # pandebot's token, so the pr is its own and runs its checks;
          # github's own token until that secret is set
          token: ${{ secrets.BOT_TOKEN || github.token }}
          author: pandebot <339883775+pandebot@users.noreply.github.com>
          committer: pandebot <339883775+pandebot@users.noreply.github.com>
          commit-message: "chore: update"
          title: "chore: update"
          body-path: ${{ runner.temp }}/body.md
