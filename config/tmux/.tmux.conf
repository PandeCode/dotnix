# tmux laid out and bound like my nvim: tabline of windows on top, the mode
# on the left as the statusline shows it, C-w style pane keys, copy mode as
# normal/visual mode. one file, no plugins, linux and macos, tmux 3.2+
#
#   curl -fsSL https://raw.githubusercontent.com/pandecode/dotnix/main/config/tmux/.tmux.conf -o ~/.tmux.conf
#
# prefix C-a, then
#   h j k l  move     C-h C-j C-k C-l  resize    s v | _  split
#   q x      close    o  only          =  even    f  zoom     T b  to a window
#   Esc [    copy mode: v V C-v select, y or C-c copy, Esc i a q back to typing

# colors, tokyo night. everything below reads these. a config that sets
# @theme and its own @c_* before sourcing this file keeps its colors
if -F "#{@theme}" {} {
    set -g @c_bg "#1a1b26"
    set -g @c_surface "#16161e"
    set -g @c_line "#2f3549"
    set -g @c_muted "#787c99"
    set -g @c_text "#a9b1d6"
    set -g @c_bright "#c0caf5"
    set -g @c_normal "#7aa2f7"
    set -g @c_insert "#9ece6a"
    set -g @c_visual "#bb9af7"
    set -g @c_command "#e0af68"
    set -g @c_replace "#f7768e"
    set -g @c_warn "#e0af68"
    set -g @c_error "#f7768e"
}

# mode faces from the nvim statusline
set -g @m_insert "(\u3063\u2022\u0300\u03c9\u2022\u0301)\u3063"
set -g @m_normal "(\u30fb_\u30fb)"
set -g @m_visual "(\u15d2\u15e8\u15d5)"
set -g @m_vline "(\u15d2\u15e8\u15d5)\u2501"
set -g @m_vblock "(\u15d2\u15e8\u15d5)\u2588"
set -g @m_prefix "(\u0e07 \u2022\u0300_\u2022\u0301)\u0e07"
set -g @m_sync "(\ub208_\ub208)"

# nerd font icons
set -g @i_cpu "\U000f035b"
set -g @i_ram "\uefc5"
set -g @i_disk "\U000f02ca"
set -g @i_net "\U000f059f"
set -g @i_bat_full "\U000f0079"
set -g @i_bat_high "\U000f0080"
set -g @i_bat_mid "\U000f007e"
set -g @i_bat_low "\U000f007b"
set -g @i_bat_empty "\U000f007a"
set -g @i_bat_charging "\U000f0084"
set -g @i_zoom "\U000f0293"
set -g @i_activity "\u25cf"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind r source-file -F "#{config_files}" \; display "config reloaded"
bind t set -g status

# panes, like C-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# split along the longer side, cells are about twice as tall as wide
bind n if -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" \
    'split-window -h -c "#{pane_current_path}"' \
    'split-window -v -c "#{pane_current_path}"'

bind q kill-pane
bind x kill-pane
bind X kill-window
bind o kill-pane -a
bind = select-layout -E
bind f resize-pane -Z
bind T break-pane
bind b break-pane -d
bind Q display-panes

bind > swap-pane -D
bind < swap-pane -U
bind m select-pane -m
bind M swap-pane
bind S setw synchronize-panes \; display "sync #{?pane_synchronized,on,off}"

# windows are the tabline, so they read like buffers
bind c new-window -c "#{pane_current_path}"
bind p previous-window
bind Tab last-window
bind -r H swap-window -d -t -1
bind -r L swap-window -d -t +1

bind D detach-client -a
bind C-s choose-session

# copy mode is normal mode
set -g mode-keys vi
bind Escape copy-mode
bind / copy-mode \; send-keys "/"
bind ? copy-mode \; send-keys "?"

unbind -T copy-mode-vi MouseDragEnd1Pane
# v, V and C-v switch between the visual kinds the way nvim does, and the
# same key again leaves visual. switching restarts the selection at the
# cursor, tmux can't change kind and keep the start
bind -T copy-mode-vi v {
    if -F "#{&&:#{selection_active},#{?rectangle_toggle,0,#{?#{==:#{selection_mode},line},0,1}}}" {
        send -X clear-selection
    } {
        send -X rectangle-off
        send -X begin-selection
    }
}
bind -T copy-mode-vi V {
    if -F "#{&&:#{selection_active},#{==:#{selection_mode},line}}" {
        send -X clear-selection
    } {
        send -X rectangle-off
        send -X select-line
    }
}
bind -T copy-mode-vi C-v {
    if -F "#{&&:#{selection_active},#{rectangle_toggle}}" {
        send -X clear-selection
    } {
        send -X begin-selection
        send -X rectangle-on
    }
}
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-c send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-end-of-line
bind -T copy-mode-vi Escape if -F "#{selection_active}" "send -X clear-selection" "send -X cancel"
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi a send -X cancel

# the prompt line edits like the nvim command line: C-w C-u C-h C-e, C-p C-n
set -g status-keys emacs

# copies go to the outer terminal over osc 52, so they reach the system
# clipboard locally, over ssh and on macos alike
set -s set-clipboard on
set -as terminal-features ",*:clipboard"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g display-time 2000
set -g display-panes-time 2000
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
setw -g aggressive-resize on
setw -g monitor-activity on
set -g visual-activity off

# macos ships a terminfo without tmux-256color
if "infocmp tmux-256color" \
    "set -g default-terminal tmux-256color" \
    "set -g default-terminal screen-256color"
set -as terminal-overrides ",*:Tc"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# look
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 120
set -gF status-style "bg=#{@c_surface} fg=#{@c_text}"

set -g status-left "#[bold]#{?client_prefix,\
#[fg=#{@c_bg} bg=#{@c_command}] #{@m_prefix} ,\
#{?pane_in_mode,#{?selection_active,\
#[fg=#{@c_bg} bg=#{@c_visual}] #{?#{&&:#{selection_active},#{rectangle_toggle}},#{@m_vblock},#{?#{==:#{selection_mode},line},#{@m_vline},#{@m_visual}}} ,\
#[fg=#{@c_bg} bg=#{@c_normal}] #{@m_normal} },\
#{?pane_synchronized,\
#[fg=#{@c_bg} bg=#{@c_replace}] #{@m_sync} ,\
#[fg=#{@c_bg} bg=#{@c_insert}] #{@m_insert} }}}\
#[default]#[fg=#{@c_bright} bold] #S #[default]"

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@c_muted} bg=#{@c_line}] #I: #W\
#{?window_zoomed_flag, #{@i_zoom},}\
#{?window_activity_flag,#[fg=#{@c_warn}] #{@i_activity},} "
setw -g window-status-current-format "#[fg=#{@c_bright} bg=#{@c_line} bold] #I: #W\
#{?window_zoomed_flag, #{@i_zoom},} "
setw -g window-status-activity-style none

set -g status-right "#{@stats}#[fg=#{@c_muted}] #h #[fg=#{@c_text}][%H:%M] "

set -gF pane-border-style "fg=#{@c_line}"
set -gF pane-active-border-style "fg=#{@c_normal}"
set -gF mode-style "bg=#{@c_line} fg=#{@c_bright}"
set -gF message-style "bg=#{@c_surface} fg=#{@c_text}"
set -gF message-command-style "bg=#{@c_surface} fg=#{@c_command}"
set -gF copy-mode-match-style "bg=#{@c_line} fg=#{@c_command}"
set -gF copy-mode-current-match-style "bg=#{@c_command} fg=#{@c_bg}"
set -gF display-panes-colour "#{@c_muted}"
set -gF display-panes-active-colour "#{@c_normal}"
set -gF clock-mode-colour "#{@c_normal}"

# cpu, ram, disk, ping and battery go into @stats. one loop per server, it
# stops when the server is gone or a reload starts a newer one. battery only
# shows up when there is one
run-shell -b '
me=$$
tmux set -g @stats_owner "$me"
get() { tmux show -gv "$1"; }
muted=$(get @c_muted); warn=$(get @c_warn); err=$(get @c_error)
i_cpu=$(get @i_cpu); i_ram=$(get @i_ram); i_disk=$(get @i_disk); i_net=$(get @i_net)
os=$(uname -s)
root=/
[ -d /System/Volumes/Data ] && root=/System/Volumes/Data

color() {
  if [ "$1" -ge "$3" ]; then echo "$err"
  elif [ "$1" -ge "$2" ]; then echo "$warn"
  else echo "$muted"; fi
}

prev_total=0
prev_idle=0
cpu_linux() {
  read -r _ user nice system idle iowait irq softirq steal _ < /proc/stat
  total=$((user + nice + system + idle + iowait + irq + softirq + steal))
  idle=$((idle + iowait))
  cpu=0
  if [ "$total" -gt "$prev_total" ] && [ "$prev_total" -gt 0 ]; then
    cpu=$((100 * (total - prev_total - idle + prev_idle) / (total - prev_total)))
  fi
  prev_total=$total
  prev_idle=$idle
}
cpu_darwin() {
  sum=0
  for v in $(ps -A -o %cpu=); do sum=$((sum + ${v%[.,]*})); done
  cpu=$((sum / $(sysctl -n hw.ncpu)))
}

ram_linux() {
  while read -r k v _; do
    case $k in
      MemTotal:) mt=$v ;;
      MemAvailable:) ma=$v ;;
    esac
  done < /proc/meminfo
  ram=$((100 * (mt - ma) / mt))
}
ram_darwin() {
  vm=$(vm_stat)
  page=$(echo "$vm" | sed -n "s/.*page size of \([0-9]*\).*/\1/p")
  active=$(echo "$vm" | sed -n "s/^Pages active: *\([0-9]*\)\./\1/p")
  wired=$(echo "$vm" | sed -n "s/^Pages wired down: *\([0-9]*\)\./\1/p")
  packed=$(echo "$vm" | sed -n "s/^Pages occupied by compressor: *\([0-9]*\)\./\1/p")
  ram=$((100 * (active + wired + packed) * page / $(sysctl -n hw.memsize)))
}

disk() {
  disk=$(df -P "$root" | sed -n "2s/.* \([0-9]*\)% .*/\1/p")
}

ping_once() {
  net=""
  command -v ping >/dev/null || return
  if [ "$os" = Darwin ]; then out=$(ping -c 1 -t 2 1.1.1.1 2>/dev/null)
  else out=$(ping -c 1 -W 2 1.1.1.1 2>/dev/null); fi
  ms=$(echo "$out" | sed -n "s/.*time[=<]\([0-9]*\).*/\1/p")
  if [ -n "$ms" ]; then
    net="#[fg=$(color "$ms" 100 200)]$i_net ${ms}ms "
  else
    net="#[fg=$err]$i_net offline "
  fi
}

battery() {
  bat=""
  pct=""
  left=""
  if [ "$os" = Darwin ]; then
    line=$(pmset -g batt 2>/dev/null | grep InternalBattery)
    [ -n "$line" ] || return 0
    pct=$(echo "$line" | sed -n "s/.*[^0-9]\([0-9]*\)%.*/\1/p")
    case $line in
      *discharging*) state=Discharging ;;
      *charging*|*finishing*) state=Charging ;;
      *) state=Full ;;
    esac
    left=$(echo "$line" | sed -n "s/.* \([0-9]*:[0-9]*\) remaining.*/\1/p")
  else
    for d in /sys/class/power_supply/BAT*; do
      [ -r "$d/capacity" ] || continue
      read -r pct < "$d/capacity"
      read -r state < "$d/status"
      now=$(cat "$d/energy_now" "$d/charge_now" 2>/dev/null | head -n 1)
      rate=$(cat "$d/power_now" "$d/current_now" 2>/dev/null | head -n 1)
      if [ "$state" = Discharging ] && [ "${rate:-0}" -gt 0 ]; then
        mins=$((60 * now / rate))
        left=$(printf "%d:%02d" $((mins / 60)) $((mins % 60)))
      fi
      break
    done
    [ -n "$pct" ] || return 0
    [ "$state" = "Not charging" ] && state=Full
  fi
  fg=$muted
  if [ "$state" = Charging ]; then icon=@i_bat_charging
  elif [ "$state" = Full ] || [ "$pct" -gt 90 ]; then icon=@i_bat_full
  elif [ "$pct" -gt 60 ]; then icon=@i_bat_high
  elif [ "$pct" -gt 30 ]; then icon=@i_bat_mid
  elif [ "$pct" -gt 15 ]; then icon=@i_bat_low; fg=$warn
  else icon=@i_bat_empty; fg=$err; fi
  bat="#[fg=$fg]$(get $icon) ${pct}%"
  if [ "$state" = Discharging ] && [ "$pct" -le 30 ] && [ -n "$left" ]; then
    bat="$bat ($left)"
  fi
  bat="$bat "
}

tick=0
while [ "$(tmux show -gv @stats_owner 2>/dev/null)" = "$me" ]; do
  if [ "$os" = Darwin ]; then cpu_darwin; ram_darwin
  else cpu_linux; ram_linux; fi
  if [ $((tick % 6)) -eq 0 ]; then disk; battery; fi
  if [ $((tick % 12)) -eq 0 ]; then ping_once; fi
  tmux set -g @stats "$bat#[fg=$(color "$cpu" 70 85)]$i_cpu ${cpu}% #[fg=$(color "$ram" 75 90)]$i_ram ${ram}% #[fg=$(color "$disk" 80 90)]$i_disk ${disk}% $net"
  tick=$((tick + 1))
  sleep 5
done'
